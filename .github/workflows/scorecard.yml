# OpenSSF Scorecard: how the repository itself is kept — pinned dependencies,
# token permissions, branch protection, review, signed releases. Results go to
# the Security tab as code-scanning alerts. They are not published to the
# OpenSSF API (`publish_results: false`); turning that on is what a public
# badge needs, and is a decision about telling the world, not a fix.
name: scorecard

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "11 6 * * 4"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
