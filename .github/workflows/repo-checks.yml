# What builds and ships the code, checked like the code: the workflows (zizmor),
# the whole history for secrets (gitleaks), and the Dockerfiles (hadolint, and
# Trivy's misconfiguration rules). Each tool runs from its image pinned by
# digest, with no token it does not need and no Docker socket.
name: repo-checks

on:
  push:
    branches: [ main ]
  pull_request:
  # zizmor's online audits learn of an action found vulnerable after it was
  # pinned; nothing in the tree changes when they do.
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  # Template injection, excessive permissions, a pin whose version comment
  # lies, an action known to be vulnerable or an impostor commit. Any finding
  # fails; a deliberate one is suppressed in .github/zizmor.yml with its reason.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --config .github/zizmor.yml .github/workflows

  # Every commit, not only the tip: a key committed and then deleted is still
  # in the history anyone can clone. GitHub's secret scanning knows providers'
  # formats; this also knows private keys and generic credentials. A test
  # fixture that looks like one is listed in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --exit-code 1 \
            --gitleaks-ignore-path /repo/.gitleaksignore /repo

  # The images' recipes. A rule set aside is set aside in .hadolint.yaml or
  # .trivyignore, with its reason.
  dockerfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            /bin/hadolint docker/Dockerfile docker/Dockerfile.base
      - name: Trivy misconfiguration rules
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            config --severity HIGH,CRITICAL --ignorefile .trivyignore \
            --exit-code 1 docker/
