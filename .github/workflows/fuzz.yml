# The coverage-guided fuzzer (tests/fuzz) for longer than the suite runs it:
# every target, half a minute each, every week and on demand. What it finds is
# kept as an artifact — the input and its traceback — and fails the run.
name: fuzz

on:
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "30"

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Base image name (lowercased)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-base" >> "$GITHUB_OUTPUT"
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '30' }}
        run: |
          case "$SECONDS_PER_TARGET" in ''|*[!0-9]*) echo "seconds must be a number"; exit 2;; esac
          docker run --rm -v "$PWD:/app" -w /app '${{ steps.img.outputs.base }}:latest' \
            python -m tests.fuzz -s "$SECONDS_PER_TARGET" \
            --corpus .fuzz/corpus --findings .fuzz/findings
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: .fuzz/findings
          if-no-files-found: ignore
