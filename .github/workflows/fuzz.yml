# The coverage-guided fuzzer (tests/fuzz) for longer than the suite runs it:
# every target, half a minute each, every week and on demand. What it finds is
# kept as an artifact — the input and its traceback — and fails the run.
name: fuzz

on:
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "30"

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provide the base image (published and verified, else built here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/provide-base.sh "ghcr.io/${GITHUB_REPOSITORY,,}-base:latest" > "$RUNNER_TEMP/base.ref"
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '30' }}
        run: |
          BASE="$(cat "$RUNNER_TEMP/base.ref")"
          case "$SECONDS_PER_TARGET" in ''|*[!0-9]*) echo "seconds must be a number"; exit 2;; esac
          docker run --rm -v "$PWD:/app" -w /app "$BASE" \
            python -m tests.fuzz -s "$SECONDS_PER_TARGET" \
            --corpus .fuzz/corpus --findings .fuzz/findings
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: .fuzz/findings
          if-no-files-found: ignore
