# CodeQL, configured here rather than by GitHub's default setup, so it can load
# this tree's model of mesh input (.github/codeql/nmesh/NMeshSources.qll).
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ python, javascript-typescript, actions ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.language == 'python' && './.github/codeql/codeql-config.yml' || '' }}
          queries: ${{ matrix.language != 'python' && 'security-extended' || '' }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
