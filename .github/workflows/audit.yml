# Known vulnerabilities in what a node installs, checked on every change and
# once a week: an advisory is published against a version long after it was
# locked, and nothing in the tree changes when it is.
name: audit

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hash-locked set the base image installs (docker/requirements.lock),
      # audited without installing it.
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: docker/requirements.lock
          require-hashes: true

  # The image already published: a fix released this week for a package in it
  # is a reason to rebuild, and nothing in the tree says so.
  published-image:
    # Not on a pull request: no change in one can fix an image already out.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Image name (lowercased)
        id: img
        run: echo "app=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Scan it
        run: |
          docker pull '${{ steps.img.outputs.app }}:latest'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress '${{ steps.img.outputs.app }}:latest'

  # The console as a browser and an attacker meet it, scanned by OWASP ZAP
  # against a throwaway node: the public pages first, then every API route the
  # pages call (tests/zap/console_openapi.py), actively and signed in. A FAIL
  # fails the job; warnings are listed (HSTS is one, on purpose — see
  # src/http_headers.py).
  console-dast:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image names (lowercased)
        id: img
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/$repo-base" >> "$GITHUB_OUTPUT"
      - name: A node to scan
        run: |
          docker network create scan
          password="$(head -c 18 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::$password"
          echo "CONSOLE_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name target --network scan \
            -e NMESH_CONSOLE_PASSWORD="$password" -e NMESH_FLEET=1 \
            '${{ steps.img.outputs.app }}:latest'
          for _ in $(seq 1 60); do
            docker logs target 2>&1 | grep -q "Web console" && exit 0
            sleep 1
          done
          docker logs target; exit 1
      - name: Describe its API
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD:/app" -w /app '${{ steps.img.outputs.base }}:latest' \
            python -m tests.zap.console_openapi https://target:8787 > zap/openapi.json
      - name: Scan the public pages
        run: |
          docker run --rm --network scan -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 \
            zap-baseline.py -t https://target:8787/ -I -J baseline.json
      - name: Scan the API, signed in
        run: |
          token="$(docker run --rm --network scan -e P="$CONSOLE_PASSWORD" \
            '${{ steps.img.outputs.base }}:latest' python -c \
            'import json,os,ssl,urllib.request as u; r=u.Request("https://target:8787/api/login", json.dumps({"password":os.environ["P"]}).encode(), {"Content-Type":"application/json"}); print(json.load(u.urlopen(r, context=ssl._create_unverified_context()))["token"])' 2>/dev/null)"
          echo "::add-mask::$token"
          docker run --rm --network scan -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -I -J api.json -T 20 \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer\ $token"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: zap/*.json
          if-no-files-found: ignore

