# Publishes the NMesh base image (Python + compiled liboqs) to GHCR.
#
# The base is the expensive, rarely-changing layer, so it is built here on its
# own rather than on every CI run: only when the dependency set (requirements.txt)
# or the base Dockerfile changes on main, plus on-demand via the Actions tab.
# The application image (docker/Dockerfile) then builds FROM this published base.
name: base-image

on:
  push:
    branches: [ main ]
    paths:
      - requirements.txt
      - docker/requirements.lock
      - scripts/liboqs.lock
      - scripts/build_liboqs.sh
      - docker/Dockerfile.base
      - .github/workflows/base-image.yml
  workflow_dispatch:

# One publication of `:latest` at a time, the newest queued last: two merges a
# minute apart started two builds, and the older one finished second and put
# its image back over the newer one.
concurrency:
  group: publish-base-image
  cancel-in-progress: false

permissions: {}

jobs:
  build-base:
    # A dispatch from another branch would publish `:latest` from it; and
    # .github/scripts/pull-verified.sh trusts only a base built from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base image name (lowercased)
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.img.outputs.base }}:latest

      # Every test runs in this image and the image every node pulls is built
      # on it: CI uses it only once this attestation proves base-image.yml on
      # main built it (.github/scripts/pull-verified.sh).
      - name: Attest the base image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.base }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Listed, not gating: the base carries the compiler liboqs was built
      # with and is never what a node runs (the application image is a fresh
      # stage, scanned with a gate by ci.yml).
      - name: List the base image's known vulnerabilities
        continue-on-error: true
        env:
          BASE: ${{ steps.img.outputs.base }}@${{ steps.push.outputs.digest }}
        run: |
          docker run --rm \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --image-src remote --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress "$BASE"
