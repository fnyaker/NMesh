# Publishes the NMesh base image (Python + compiled liboqs) to GHCR.
#
# The base is the expensive, rarely-changing layer, so it is built here on its
# own rather than on every CI run: only when the dependency set (requirements.txt)
# or the base Dockerfile changes on main, plus on-demand via the Actions tab.
# The application image (docker/Dockerfile) then builds FROM this published base.
name: base-image

on:
  push:
    branches: [ main ]
    paths:
      - requirements.txt
      - docker/requirements.lock
      - scripts/liboqs.lock
      - scripts/build_liboqs.sh
      - docker/Dockerfile.base
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions: {}

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Base image name (lowercased)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.img.outputs.base }}:latest
