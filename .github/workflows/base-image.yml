# Publishes the NMesh base image (Python + compiled liboqs) to GHCR.
#
# The base is the expensive, rarely-changing layer, so it is built here on its
# own rather than on every CI run: only when the dependency set (requirements.txt)
# or the base Dockerfile changes on main, plus on-demand via the Actions tab.
# The application image (docker/Dockerfile) then builds FROM this published base.
name: base-image

on:
  push:
    branches: [ main ]
    paths:
      - requirements.txt
      - docker/requirements.lock
      - scripts/liboqs.lock
      - scripts/build_liboqs.sh
      - docker/Dockerfile.base
      - .github/workflows/base-image.yml
  workflow_dispatch:

# One publication of `:latest` at a time, the newest queued last: two merges a
# minute apart started two builds, and the older one finished second and put
# its image back over the newer one.
concurrency:
  group: publish-base-image
  cancel-in-progress: false

permissions: {}

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base image name (lowercased)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.img.outputs.base }}:latest
