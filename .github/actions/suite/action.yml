# The unit and integration suites, inside the base image: run by ci.yml's
# `test` job on every change and by release.yml's before anything is published,
# so a release is the commit the suite ran on and not merely one it ran near.
# An action rather than a reusable workflow so each caller's job keeps the name
# `test`: a required status check is matched by that name, and a reusable
# workflow reports as `test / test`.
#
# The base image already carries a compiled liboqs and every dependency
# (docker/Dockerfile.base, base-image.yml), so the suite runs on the runtime
# the app ships with. The published base is used only once its provenance is
# verified; otherwise it is built here (.github/scripts/provide-base.sh).
# The caller checks the tree out first.
name: suite
description: Unit and integration suites inside the verified base image

inputs:
  token:
    description: the job's GITHUB_TOKEN, to verify the base and pull it on main
    required: true

runs:
  using: composite
  steps:
    - name: Base image name (lowercased)
      id: img
      shell: bash
      run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}-base" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Provide the base image (published and verified, else built here)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE_NAME: ${{ steps.img.outputs.base }}
      run: |
        .github/scripts/provide-base.sh "$BASE_NAME:latest" > "$RUNNER_TEMP/base.ref"

    - name: Unit tests (in the base image — liboqs already compiled)
      shell: bash
      run: |
        BASE="$(cat "$RUNNER_TEMP/base.ref")"
        docker run --rm -v "$PWD:/app" -w /app "$BASE" \
          sh -c "python -c 'import oqs; print(\"liboqs ready (prebuilt)\")' && pytest -q"

    - name: Integration tests
      shell: bash
      run: |
        BASE="$(cat "$RUNNER_TEMP/base.ref")"
        docker run --rm -v "$PWD:/app" -w /app "$BASE" pytest tests/integration -q
