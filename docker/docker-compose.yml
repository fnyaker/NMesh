# A single relay node: mesh TCP open to the world, and the web console exposed
# on all interfaces so you can reach the dashboard from another machine.
# Bring it up with: docker compose -f docker/docker-compose.yml up -d
#
# By default this pulls the image published by CI (ghcr.io/fnyaker/nmesh:latest).
# To build locally instead: docker compose -f docker/docker-compose.yml build
# (the app image builds FROM the published base ghcr.io/fnyaker/nmesh-base; to
#  build that base yourself: docker build -f docker/Dockerfile.base -t \
#  ghcr.io/fnyaker/nmesh-base:latest .)
#
# Open the dashboard at  https://<server-ip>:8787/  (self-signed TLS → your
# browser will warn once; that's expected, click through to proceed).
services:
  nmesh:
    image: ghcr.io/fnyaker/nmesh:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NMESH_LISTEN: "0.0.0.0:9000"
      NMESH_CONSOLE_HOST: "0.0.0.0"
      NMESH_CONSOLE_PORT: "8787"
      # Dashboard password. Easiest: uncomment the next line and set your own —
      # then you log in with exactly that. If you leave it commented out, a
      # strong random password is generated on first start and printed in the
      # logs; read it with:
      #     docker compose -f docker/docker-compose.yml logs nmesh | grep Password
      # NMESH_CONSOLE_PASSWORD: "choose-your-own-password"
      #
      # Fleet app (remote management + deployment, served at /fleet). Off by
      # default because it can open a shell; uncomment to have it start enabled,
      # or toggle it from the console's Apps tab (the choice persists in /data).
      # NMESH_FLEET: "1"
    ports:
      - "9000:9000"                 # mesh TCP — reachable so this node can relay
      - "8787:8787"                 # web console — exposed on all interfaces
                                    # (HTTPS + password + login lockout). To keep
                                    # it host-only instead: "127.0.0.1:8787:8787".
    volumes:
      - nmesh_data:/data            # identity, certs, sessions, console password persist here
      #
      # SSH keys for the fleet app's LAN provisioning.
      # A container has no ~/.ssh, so key auto-detection finds nothing. Two ways
      # to give the node a key — pick either:
      #
      #  1. Mount your own keys read-only. The path below is where the node
      #     looks (its HOME is /root inside the image). Read-only on purpose:
      #     the node only ever reads a key, never writes one.
      # - ${HOME}/.ssh:/root/.ssh:ro
      #     Narrower, and usually what you want — expose one key, not the whole
      #     directory (mount the .pub too if you want its comment shown):
      # - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      # - ${HOME}/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      #
      #  2. Or upload a key from the console: Fleet → Discover & deploy →
      #     "Add a key". It is stored in this node's *encrypted* app store
      #     (inside /data) and written to a private temp file only while a
      #     command runs. Nothing to mount.
      #
      # Either way the key never leaves this node except, for a provisioning run
      # you asked a managed node to perform, inside the end-to-end-encrypted
      # payload sent to that node.

volumes:
  nmesh_data:
